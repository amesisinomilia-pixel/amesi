<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<script src="https://office.directdemocra.cy/iframe_api.js"></script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#6b7280;font-family:Arial,sans-serif}
button{width:100%;height:100%;box-sizing:border-box;border:0;border-radius:0;background:#6b7280;color:#fff;font-size:11px;font-weight:800;letter-spacing:.01em;box-shadow:0 3px 12px #0004;padding:0 6px;white-space:nowrap;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
button.unread{background:#d93025}
</style>
</head>
<body>
<button id="contact" type="button">Επικοινωνία</button>
<script>
(() => {
  const APP_URL = location.origin;
  const button = document.getElementById("contact");

  function paint(unread) {
    button.classList.toggle("unread", Boolean(unread));
    button.textContent = unread ? "● Επικοινωνία" : "Επικοινωνία";
    button.title = unread ? "Νέα μη αναγνωσμένα μηνύματα" : "Επικοινωνία";
  }

  async function openCaiPRUS() {
    try {
      WA.ui.modal.openModal({
        title: "CaiPRUS",
        src: APP_URL,
        allow: null,
        allowApi: true,
        position: "right",
        allowFullScreen: true
      });
    } catch (e) {
      console.error("CaiPRUS mobile modal failed:", e);
    }
  }

  WA.onInit().then(() => {
    paint(Boolean(WA.player.state.caiprusUnread));
    WA.player.state.onVariableChange("caiprusUnread").subscribe(value => {
      paint(Boolean(value));
    });
    button.addEventListener("click", openCaiPRUS);
  }).catch(e => console.error("CaiPRUS mobile launcher init failed:", e));
})();
</script>
</body>
</html>
